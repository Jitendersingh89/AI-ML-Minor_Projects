<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <!-- Ask Anything -->
        <h2>Ask Anything</h2>

        <form id="askForm">
            <input
                type="text"
                name="question"
                placeholder="Ask anything..."
                required
            >

            <button type="submit">Ask</button>
        </form>

        <p id="ans-loading" style="display:none;">Processing...</p>

        <p id="answer"></p>

        <hr>

        <!-- Email Summarizer -->
        <h2>Summarize Email</h2>

        <form id="emailForm">
            <textarea
                name="email"
                placeholder="Paste your email here..."
                rows="8"
                required
            ></textarea>

            <button type="submit">Summarize</button>
        </form>

        <p id="summary-loading" style="display:none;">Processing...</p>

        <p id="summary"></p>

    </div>

<script>

const askForm = document.getElementById("askForm");
const emailForm = document.getElementById("emailForm");


// ======================
// Ask Anything
// ======================

askForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const formData = new FormData(askForm);

    document.getElementById("ans-loading").style.display = "block";
    document.getElementById("answer").innerText = "";

    try{

        const res = await fetch("/ask",{
            method:"POST",
            body:formData
        });

        const data = await res.json();

        document.getElementById("answer").innerText = data.response;

    }
    catch(err){

        document.getElementById("answer").innerText =
        "Something went wrong.";

        console.error(err);

    }

    document.getElementById("ans-loading").style.display = "none";

});


// ======================
// Email Summarizer
// ======================

emailForm.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const formData = new FormData(emailForm);

    document.getElementById("summary-loading").style.display = "block";
    document.getElementById("summary").innerText = "";

    try{

        const res = await fetch("/summarize",{
            method:"POST",
            body:formData
        });

        const data = await res.json();

        document.getElementById("summary").innerText = data.response;

    }
    catch(err){

        document.getElementById("summary").innerText =
        "Something went wrong.";

        console.error(err);

    }

    document.getElementById("summary-loading").style.display = "none";

});

</script>

</body>
</html>
